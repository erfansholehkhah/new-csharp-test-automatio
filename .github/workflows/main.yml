name: Build 
on:
  push:
    branches: [main]


jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4  
      - name:  SetUp MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2 
      - name: Restore packages
        run: nuget restore 

      - name: Build
        run: msbuild /p:Configuration=Release 
      
        
      
